# Verificações de todo PR e de todo push na main: tipos de todos os pacotes, testes do servidor (com o motor de
# ponta a ponta e provedores falsos) e o build da interface. Um PR só entra se tudo passar.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tipos (todos os pacotes)
        run: pnpm -r typecheck
      - name: Testes do servidor
        run: pnpm --filter @empresa/server test
      - name: Build da interface
        run: pnpm --filter @empresa/web build
      # Fumaça: o servidor de verdade sobe e responde, e cada página da interface abre no Chrome sem erro.
      # Os testes de unidade não pegam erro de inicialização (uma rota registrada depois do listen derrubou o
      # Hefesto por 5 minutos) nem página em branco (um erro de renderização apagou Conversas).
      - name: Servidor sobe e a interface abre sem erro
        working-directory: apps/server
        run: |
          D=$(mktemp -d)
          EMPRESA_DATA_DIR="$D" EMPRESA_WORKSPACE_DIR="$D/ws" API_PORT=4399 node --import tsx src/index.ts > "$D/srv.log" 2>&1 &
          for i in $(seq 1 45); do
            if curl -sf -o /dev/null http://127.0.0.1:4399/api/motor; then echo "subiu em ~$((i*2)) s"; break; fi
            if [ "$i" = 45 ]; then cat "$D/srv.log"; exit 1; fi
            sleep 2
          done
          node --import tsx scripts/fumaca-interface.ts http://127.0.0.1:4399 fumaca-interface || { tail -50 "$D/srv.log"; exit 1; }
      - name: Prints das páginas com problema
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fumaca-interface
          path: apps/server/fumaca-interface
          if-no-files-found: ignore
