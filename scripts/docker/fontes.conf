<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Fontes das telas que os agentes desenham (gerar_imagem) e dos prints do navegador: as genéricas e as
     de sistema do Mac/Windows caem em fontes de verdade, não na de máquina de escrever. -->
<fontconfig>
  <alias><family>sans-serif</family><prefer><family>Inter</family><family>Noto Sans</family></prefer></alias>
  <alias><family>sans</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>ui-sans-serif</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>-apple-system</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>BlinkMacSystemFont</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>Segoe UI</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>Helvetica Neue</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>Helvetica</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Geist Mono</family></prefer></alias>
  <alias><family>ui-monospace</family><prefer><family>Geist Mono</family></prefer></alias>
  <alias><family>SFMono-Regular</family><prefer><family>Geist Mono</family></prefer></alias>
  <alias><family>Menlo</family><prefer><family>Geist Mono</family></prefer></alias>
  <alias><family>Consolas</family><prefer><family>Geist Mono</family></prefer></alias>
</fontconfig>
